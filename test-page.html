<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>求职表单助手本地验收页</title></head><body><h1>招聘申请测试页</h1><form id="application"><label>姓名<input name="candidateName"></label><label>手机号码<input name="mobile"></label><label>电子邮箱<input type="email" autocomplete="email"></label><label>出生日期<input type="date" name="birthday"></label><label>最高学历<select name="degree"><option>本科</option><option>硕士</option><option>博士</option></select></label><fieldset><legend>性别</legend><label><input type="radio" name="gender" value="男">男</label><label><input type="radio" name="gender" value="女">女</label></fieldset><label><input type="checkbox" name="transfer">是否接受调剂</label><label>个人介绍<textarea placeholder="请介绍自己"></textarea></label><label>React 风格受控输入<input id="controlled" placeholder="所在城市"></label><label>身份证号码<input name="idCard"></label><label>上传简历<input type="file" name="resume"></label><button id="submit" type="submit">最终提交申请</button></form><p id="events"></p><script>let submitted=false;document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();submitted=true;document.body.dataset.submitted='true'});const c=document.querySelector('#controlled');let state='';Object.defineProperty(c,'value',{get(){return state},set(v){state=v}});c.addEventListener('input',()=>document.querySelector('#events').textContent='controlled input event received');</script></body></html>
